name: CI - Tests & Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/.gitignore'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Portfolio (Typecheck, Lint, Build & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify checks, lint, build and unit tests
        run: npm run verify

      - name: Verify HTTP server test
        run: npm run test:http

      - name: Verify production build configuration
        env:
          SITE_URL: https://agustinperez.dev.ar
          PUBLICATION_READY: 'true'
        run: npm run build
