# Ejemplo para un Nginx de entrada YA instalado en la VM.
# Instalar security-headers.conf en /etc/nginx/snippets/portfolio-security.conf.
# Activar el bloque HTTPS sólo cuando existan certificados válidos.
# Las rutas de certificado son ejemplos: adaptarlas al emisor/renovador real.
server {
    listen 80;
    server_name agustinperez.dev.ar;
    return 301 https://agustinperez.dev.ar$request_uri;
}

server {
    listen 443 ssl;
    server_name agustinperez.dev.ar;
    ssl_certificate /etc/ssl/portfolio/fullchain.pem;
    ssl_certificate_key /etc/ssl/portfolio/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/portfolio/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    include /etc/nginx/snippets/portfolio-security.conf;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/portfolio-security.conf;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/portfolio-security.conf;
    }
    location ~* ^/(images|fonts)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/portfolio-security.conf;
    }
    location ~ /\. { deny all; }
    error_page 404 /404.html;
}
